<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>NIMBUS LGU</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/dashboard.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="/dashboard.js" defer></script>
</head>
<body>
<!-- Line icons. Shapes carry meaning without color: circle-! error, octagon block,
     triangle warning, circle-check ok, circle-dash no details. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-waves" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M2 13c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M2 19c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/></g></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/><path d="M10 20v-5h4v5"/></g></symbol>
    <symbol id="i-home-full" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></g><path d="M8 12.5h8V19H8z" fill="currentColor"/></symbol>
    <symbol id="i-road" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3 4 21"/><path d="M16 3l4 18"/><path d="M12 4v3M12 10.5v3M12 17v3"/></g></symbol>
    <symbol id="i-school" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5 12 4.5l10 5-10 5z"/><path d="M6 11.5v4.5c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.5"/><path d="M22 9.5v5"/></g></symbol>
    <symbol id="i-campaign" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h3.5L13 18.5v-13L6.5 10z"/><path d="M17 9a4 4 0 0 1 0 6"/><path d="M19.5 6.5a7.5 7.5 0 0 1 0 11"/></g></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M7 19h10.5a4.5 4.5 0 0 0 .6-8.96A6.5 6.5 0 0 0 5.6 9.3 4.9 4.9 0 0 0 7 19z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21.5s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12z"/><circle cx="12" cy="9.5" r="2.5"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.7 2.7L16.2 9.5"/></g></symbol>
    <symbol id="i-error" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/></g><circle cx="12" cy="16.5" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-block" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.3 3h7.4L21 8.3v7.4L15.7 21H8.3L3 15.7V8.3z"/><path d="M8 12h8"/></g></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5"/></g><circle cx="12" cy="17.2" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-dash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></g></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18.5" cy="12" r="1.8" fill="currentColor"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></g></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 21 12 4 4l2.2 8z"/><path d="M6.2 12H13"/></g></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></g></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/></g><circle cx="12" cy="7.8" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-signal" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M5 20v-3.5M10 20v-7.5M15 20V9M20 20V5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 10.5 5 5 5-5"/><path d="M5 20h14"/></g></symbol>
  </defs>
</svg>

<a class="skip" href="#main">Skip to content</a>

<!-- Sign-in -->
<div id="login-view" class="login" hidden>
  <div class="login-sky" aria-hidden="true"></div>
  <form id="login-form" class="login-card" novalidate>
    <div class="login-brand">
      <span class="brand-mark"><svg class="i" aria-hidden="true"><use href="#i-cloud"/></svg></span>
      <span class="brand-name">NIMBUS</span><span class="pill-lgu">LGU</span>
    </div>
    <h1>Sign in to publish town updates</h1>
    <p class="sub">What you publish reaches residents in the NIMBUS app and by SMS.</p>
    <div id="login-note" class="banner warning" hidden><svg class="i" aria-hidden="true"><use href="#i-clock"/></svg><p></p></div>
    <div id="login-error" class="banner danger" role="alert" hidden><svg class="i" aria-hidden="true"><use href="#i-error"/></svg><p></p></div>
    <div class="field">
      <label class="label" for="lg-user">Username</label>
      <input id="lg-user" class="input input-lg" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label class="label" for="lg-pass">Password</label>
      <div class="pass-wrap">
        <input id="lg-pass" class="input input-lg" type="password" autocomplete="current-password" required>
        <button id="lg-show" class="btn btn-tertiary btn-sm" type="button" aria-pressed="false" aria-controls="lg-pass">Show</button>
      </div>
      <p id="lg-caps" class="hint-inline warning-ink" hidden><svg class="i i-sm" aria-hidden="true"><use href="#i-warn"/></svg>Caps Lock is on</p>
    </div>
    <label class="check"><input id="lg-keep" type="checkbox"> Keep me signed in on this device</label>
    <button id="lg-submit" class="btn btn-primary btn-block" type="submit">Sign in</button>
    <p class="foot-note">Accounts are issued by the NIMBUS administrator. Don't share passwords.</p>
  </form>
</div>

<!-- App shell -->
<div id="app" class="app" hidden>
  <header id="topbar" class="topbar"></header>
  <nav id="rail" class="rail" aria-label="Sections" hidden></nav>
  <main id="main" class="main" tabindex="-1">
    <div id="banners" class="banners"></div>
    <div id="view" class="view"></div>
  </main>
  <aside id="preview-rail" class="preview-rail" aria-label="What residents see" hidden></aside>
  <div id="publish-bar" class="publish-bar" hidden></div>
</div>

<div id="toasts" class="toast-region" aria-live="polite"></div>

<dialog id="review"></dialog>
<dialog id="confirm"></dialog>
<dialog id="conflict"></dialog>
<dialog id="reauth"></dialog>
<dialog id="leave"></dialog>
<dialog id="delete"></dialog>
<dialog id="history"></dialog>
<dialog id="preview-sheet"></dialog>
</body>
</html>
