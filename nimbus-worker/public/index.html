<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIMBUS LGU Dashboard</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#10213f;background:#edf3fb}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid #dbe5f3;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}.brand b{width:38px;height:38px;border-radius:12px;background:#2f6fe4;color:#fff;display:grid;place-items:center}.account{display:flex;align-items:center;gap:10px}.pill{border:1px solid #dbe5f3;background:#f7faff;border-radius:999px;padding:8px 12px}.btn{border:0;border-radius:10px;padding:11px 16px;background:#2f6fe4;color:#fff;font-weight:750}.btn.secondary{background:#edf3fb;color:#28548f}.btn.danger{background:#d23f5e}.layout{max-width:1180px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}.card{background:#fff;border:1px solid #dbe5f3;border-radius:18px;padding:20px}.towns{display:grid;gap:8px;margin-top:14px}.town{border:1px solid #dbe5f3;border-radius:10px;background:#fff;padding:12px;text-align:left}.town.active{border-color:#2f6fe4;background:#eaf1fd;color:#1d4da3}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:750}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd9ec;border-radius:10px;padding:11px;background:#fff}.field textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.notice{padding:12px;border-radius:10px;background:#edf3fb;margin-bottom:16px}.notice.error{background:#fff0f3;color:#a51e43}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);background:#fff;border:1px solid #dbe5f3;border-radius:20px;padding:28px}.login-card h1{margin:0 0 6px}.login-card p{color:#667793;margin:0 0 24px}.statusline{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.toggle{display:flex;align-items:center;gap:10px}.actions{display:flex;justify-content:flex-end;gap:10px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.entries{display:grid;gap:8px}.entry{display:grid;grid-template-columns:minmax(0,1fr) 120px 120px auto;gap:8px}.entry input,.entry select{min-width:0}.remove{border:0;background:#fff0f3;color:#a51e43;border-radius:8px}.map-editor{height:360px;border:1px solid #ccd9ec;border-radius:14px;overflow:hidden;margin-bottom:12px}.pin-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.pin-grid input,.pin-grid select{min-width:0;width:100%;border:1px solid #ccd9ec;border-radius:9px;padding:9px}.pin-list{display:grid;gap:8px}.pin-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px 82px auto;gap:8px;align-items:center}.pin-row small{color:#667793}@media(max-width:760px){.topbar{padding:0 16px}.account .pill{display:none}.layout{padding:16px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.entry{grid-template-columns:1fr}.entry button{min-height:38px}.pin-grid{grid-template-columns:1fr}.pin-row{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div id="login" class="login">
  <form id="loginForm" class="login-card">
    <h1>NIMBUS LGU</h1><p>Sign in to publish verified town announcements.</p>
    <div id="loginError" class="notice error hidden"></div>
    <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%" type="submit">Sign in</button>
  </form>
</div>
<div id="app" class="shell hidden">
  <header class="topbar"><div class="brand"><b>N</b>NIMBUS LGU</div><div class="account"><span id="accountName" class="pill"></span><button id="logout" class="btn secondary">Sign out</button></div></header>
  <main class="layout"><div id="message" class="notice hidden"></div><div class="grid"><aside class="card"><h3>Assigned towns</h3><div id="towns" class="towns"></div></aside>
  <section class="card"><div class="statusline"><div><h2 id="townTitle">Town update</h2><small id="savedTime"></small></div></div>
    <div class="row"><div class="field"><label>Class status</label><select id="classes"><option value="0">0 — No suspension</option><option value="1">1 — All levels</option><option value="2">2 — Preschool to SHS</option><option value="3">3 — Preschool to grade 10</option><option value="4">4 — Preschool to grade 6</option><option value="5">5 — Preschool only</option></select></div><div class="field"><label>Public notice</label><textarea id="notice"></textarea></div></div>
    <div class="field"><div class="section-head"><label>Flood areas</label><button class="btn secondary" type="button" id="addFlood">+ Add</button></div><div id="floods" class="entries"></div></div>
    <div class="field"><div class="section-head"><label>Evacuation centers</label><button class="btn secondary" type="button" id="addEvac">+ Add</button></div><div id="evacs" class="entries"></div></div>
    <div class="field"><div class="section-head"><label>Road statuses</label><button class="btn secondary" type="button" id="addRoad">+ Add</button></div><div id="roads" class="entries"></div></div>
    <div class="field"><div class="section-head"><label>Map pins</label><small>Click the map to choose a location</small></div><div id="pinMap" class="map-editor"></div><div class="pin-grid"><select id="pinCategory"><option value="flood">Flood</option><option value="evacuation">Evacuation center</option><option value="road">Road</option></select><input id="pinLabel" placeholder="Pin label"><input id="pinLat" type="number" step="any" placeholder="Latitude"><input id="pinLng" type="number" step="any" placeholder="Longitude"><select id="pinStatus"><option value="C">Clear / No flooding</option><option value="F">Flooding / Open</option><option value="W">On watch</option><option value="L">Limited</option><option value="O">Open</option><option value="X">Closed</option></select></div><div class="field" style="margin-top:8px"><label for="pinIntensity">Intensity: <span id="pinIntensityLabel">50</span>%</label><input id="pinIntensity" type="range" min="0" max="100" value="50"></div><button id="addPin" class="btn secondary" type="button">Add pin and speech bubble</button><div id="pinList" class="pin-list" style="margin-top:10px"></div></div>
    <div class="actions"><button id="delete" class="btn danger">Clear update</button><button id="publish" class="btn">Publish to NIMBUS</button></div>
  </section></div></main>
</div>

    const remove=document.createElement('button'); remove.type='button';remove.className='remove';remove.textContent='Remove';remove.onclick=()=>row.remove();row.append(remove);container.append(row);

  function addFlood(name='',level='M',status='C'){addRow($('floods'),[{placeholder:'Area name',value:name},{tag:'select',value:level,options:[{value:'H',label:'High'},{value:'M',label:'Medium'},{value:'L',label:'Low'}]},{tag:'select',value:status,options:[{value:'F',label:'Flooding'},{value:'W',label:'On watch'},{value:'C',label:'Clear'}]}])}

  function addRoad(name='',status='O'){addRow($('roads'),[{placeholder:'Road name',value:name},{tag:'select',value:status,options:[{value:'O',label:'Open'},{value:'L',label:'Limited'},{value:'X',label:'Closed'}]}])}
  function addPin(name='',lat='',lng=''){addRow($('mapPins'),[{placeholder:'Pin name',value:name},{placeholder:'Latitude',value:lat},{placeholder:'Longitude',value:lng}])}
  $('addFlood').onclick=()=>addFlood(); $('addEvac').onclick=()=>addEvac(); $('addRoad').onclick=()=>addRoad(); $('addPin').onclick=()=>addPin();

  function collect(container, fields){
    return [...container.children].map(row=>{const inputs=[...row.querySelectorAll('input,select')];return Object.fromEntries(fields.map((key,i)=>[key, inputs[i]?.tagName==='SELECT'?inputs[i].value:(inputs[i]?.type==='number'?Number(inputs[i].value):inputs[i].value.trim())])).filter&&Object.fromEntries(fields.map((key,i)=>[key,inputs[i]?.tagName==='SELECT'?inputs[i].value:(inputs[i]?.type==='number'?Number(inputs[i].value):inputs[i].value.trim())]))}).filter(item=>Object.values(item).every(v=>v!==''));
